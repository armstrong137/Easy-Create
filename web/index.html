<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- 缺了 viewport 的话，手机浏览器会把双指当成"页面缩放"吃掉，
       星球的捏合缩放永远收不到手势 -->
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="novel_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
      inset: 0;
      background: #02040b url("assets/assets/textures/starfield_1.jpg") center / cover no-repeat fixed;
    }
    /* 手势全部交给 Flutter，浏览器不做滚动/缩放 */
    body { touch-action: none; overscroll-behavior: none; }
    #app_boot_cover {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: grid;
      place-items: center;
      pointer-events: none;
      color: rgba(255, 255, 255, 0.92);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 30px;
      font-style: italic;
      letter-spacing: 0;
      background:
        radial-gradient(circle at 50% 34%, rgba(80, 110, 170, 0.34), transparent 34%),
        linear-gradient(180deg, rgba(2, 4, 11, 0.12), rgba(2, 4, 11, 0.82)),
        url("assets/assets/textures/starfield_1.jpg") center / cover no-repeat;
      opacity: 1;
      transition: opacity 360ms ease;
    }
    #app_boot_cover.app_boot_cover_hidden {
      opacity: 0;
    }
  </style>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>novel_app</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="app_boot_cover" aria-hidden="true">Create Something</div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // iOS Safari 无视 user-scalable=no，必须显式拦截：
    // gesturestart/gesturechange 是 Safari 的双指缩放；多指 touchmove 同理。
    // 拦掉之后双指事件才会落到 Flutter，由星球场景做镜头推进。
    // 单指 touchmove 不拦，魔毯列表等仍可正常滚动。
    for (const type of ['gesturestart', 'gesturechange', 'gestureend']) {
      document.addEventListener(type, (e) => e.preventDefault(), { passive: false });
    }
    document.addEventListener('touchmove', (e) => {
      if (e.touches.length > 1) e.preventDefault();
    }, { passive: false });
    // 双击缩放（iOS 的 300ms 双击放大页面）
    document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });

    // iPhone Safari 聚焦输入框时会尝试滚动页面，把 Flutter 画布顶到状态栏下。
    // 根节点已 fixed，这里再在键盘/焦点变化后把页面位置钉回原点。
    const keepFlutterViewportPinned = () => window.scrollTo(0, 0);
    window.addEventListener('focusin', () => setTimeout(keepFlutterViewportPinned, 0));
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', keepFlutterViewportPinned);
      window.visualViewport.addEventListener('scroll', keepFlutterViewportPinned);
    }
    window.addEventListener('flutter-first-frame', () => {
      const cover = document.getElementById('app_boot_cover');
      if (!cover) return;
      cover.classList.add('app_boot_cover_hidden');
      setTimeout(() => cover.remove(), 420);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
