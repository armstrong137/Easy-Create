<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- 缺了 viewport 的话，手机浏览器会把双指当成"页面缩放"吃掉，
       星球的捏合缩放永远收不到手势 -->
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="novel_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <style>
    @font-face {
      font-family: "EasyCreateBrand";
      src: url("assets/assets/fonts/CormorantGaramond-SemiBoldItalic.ttf") format("truetype");
      font-weight: 600;
      font-style: italic;
      font-display: swap;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
      inset: 0;
      background: #02040b url("assets/assets/textures/starfield_4.jpg") center / cover no-repeat fixed;
    }
    /* 手势全部交给 Flutter，浏览器不做滚动/缩放 */
    body { touch-action: none; overscroll-behavior: none; }
    /* HTML 启动屏：与 Flutter 侧 Easy Create 封面同款视觉——
       标题/副标题/深空底完全一致，引擎交接时用户看不出换了画面（一段式） */
    #app_boot_cover {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      background:
        radial-gradient(120% 90% at 50% 30%,
          rgba(11, 18, 48, 0.28) 0%,
          rgba(6, 10, 29, 0.52) 45%,
          rgba(2, 4, 11, 0.82) 100%),
        url("assets/assets/textures/starfield_4.jpg") center / cover no-repeat;
      opacity: 1;
      transition: opacity 360ms ease;
    }
    #app_boot_cover h1 {
      margin: 0;
      color: rgba(255, 255, 255, 0.96);
      font: italic 600 34px "EasyCreateBrand", Georgia, "Times New Roman", serif;
      letter-spacing: 1.2px;
    }
    #app_boot_cover p {
      margin: 14px 0 0;
      color: rgba(255, 255, 255, 0.56);
      font-size: 13px;
      font-family: system-ui, sans-serif;
    }
    #app_boot_cover.app_boot_cover_hidden {
      opacity: 0;
    }
  </style>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>novel_app</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="app_boot_cover" aria-hidden="true">
    <h1>Easy Create</h1>
    <p>正在点亮你的宇宙…</p>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // 局域网真机联调：Flutter 的 Service Worker 会把整包构建缓存进 Cache Storage，
    // 且优先于 HTTP 的 no-store 响应——手机上跑的常常是**上一版构建**（本项目
    // 多次"改完请复测"实际测的是旧包，导致改对了也看不到效果）。这里主动注销
    // 已装的 SW 并清空缓存；配合 serve_web.ps1 的 --pwa-strategy=none（不再注册新 SW）。
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations()
        .then((rs) => rs.forEach((r) => r.unregister()))
        .catch(() => {});
    }
    if (window.caches && caches.keys) {
      caches.keys().then((ks) => ks.forEach((k) => caches.delete(k))).catch(() => {});
    }

    // iOS Safari 无视 user-scalable=no，必须显式拦截：
    // gesturestart/gesturechange 是 Safari 的双指缩放；多指 touchmove 同理。
    // 拦掉之后双指事件才会落到 Flutter，由星球场景做镜头推进。
    // 单指 touchmove 不拦，魔毯列表等仍可正常滚动。
    for (const type of ['gesturestart', 'gesturechange', 'gestureend']) {
      document.addEventListener(type, (e) => e.preventDefault(), { passive: false });
    }
    document.addEventListener('touchmove', (e) => {
      if (e.touches.length > 1) e.preventDefault();
    }, { passive: false });
    // 双击缩放（iOS 的 300ms 双击放大页面）
    document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });

    // iPhone Safari 聚焦输入框时会尝试滚动页面，把 Flutter 画布顶到状态栏下。
    // 根节点已 fixed，这里再在键盘/焦点变化后把页面位置钉回原点。
    const keepFlutterViewportPinned = () => window.scrollTo(0, 0);
    window.addEventListener('focusin', () => setTimeout(keepFlutterViewportPinned, 0));
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', keepFlutterViewportPinned);
      window.visualViewport.addEventListener('scroll', keepFlutterViewportPinned);
    }
    const bootMinVisibleMs = 2200;
    const bootMaxVisibleMs = 5200;
    let bootHideTimer = 0;
    const hideBootCover = () => {
      const cover = document.getElementById('app_boot_cover');
      if (!cover) return;
      cover.classList.add('app_boot_cover_hidden');
      setTimeout(() => cover.remove(), 420);
    };
    window.addEventListener('flutter-first-frame', () => {
      clearTimeout(bootHideTimer);
      bootHideTimer = setTimeout(hideBootCover, bootMinVisibleMs);
    });
    bootHideTimer = setTimeout(hideBootCover, bootMaxVisibleMs);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
