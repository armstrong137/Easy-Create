<!DOCTYPE html>
<!--
  首页正式 3D 星球场景（阶段八 P2-1，three.js r147 离线打包）
  - 透明背景：星空仍由 Flutter 层（四档银河图）负责，本场景只渲染星球
  - URL 参数初始化：?planet=earth&spin=0.008&stage=3（避免加载时序竞态）
  - Flutter → JS：setSpin(转/秒)、setZoom(倍率)、pauseRender()、resumeRender()
    （移动端 runJavaScript 直调；Web 端 iframe postMessage，见底部 message 监听）
  - JS → Flutter：SceneBridge 通道上报 {ready, fps}
  - 手势全部在 Flutter 层处理（本层 pointer 透明）：缩放经 setZoom 做**镜头推进**，
    而非位图放大——放大后重新渲染，多近都清晰，且镜头恒沿视线故星球始终居中
-->
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: transparent; touch-action: none; }
  canvas { display: block; }
</style>
</head>
<body>
<script src="three.min.js"></script>
<script>
'use strict';

// ---------- 启动参数 ----------
const params = new URLSearchParams(location.search);
const planetName = params.get('planet') || 'earth';
let spinRevPerSec = parseFloat(params.get('spin') || '0.008');
const stageScale = Math.max(1, parseFloat(params.get('stage') || '1'));

// ---------- 渲染器：透明底叠在 Flutter 星空之上 ----------
const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: true,
  powerPreference: 'high-performance',
});
renderer.setClearColor(0x000000, 0);
// 手机（触屏）显存吃紧：像素比封 2.5；桌面放开到 3
const isMobileLike = window.matchMedia('(pointer: coarse)').matches;
renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobileLike ? 2.5 : 3));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);

// 取景：星球占满视口短边（Flutter 侧 SizedBox 已按直径定尺寸，土星留环余量）
function fitDistance(radius, margin) {
  const vfov = camera.fov * Math.PI / 180;
  const hfov = 2 * Math.atan(Math.tan(vfov / 2) * camera.aspect);
  return margin * radius / Math.tan(Math.min(vfov, hfov) / 2);
}

// ---------- 光照：主光方向与现有 shader 星球一致（右上前方） ----------
const sunDir = new THREE.Vector3(5, 2, 3).normalize();
const sun = new THREE.DirectionalLight(0xffffff, 1.25);
sun.position.copy(sunDir);
scene.add(sun);
scene.add(new THREE.AmbientLight(0x334455, 0.42));

// ---------- 星球材质组配置 ----------
// LOD 三档：map 常态 / mapMid 手机放大档（≤4096）/ mapHi 桌面放大档（源图上限）
// 手机不能上 8192：单张纹理占显存 8192×4096×4B ≈ 134MB，iPhone Safari 直接卡死。
const PLANETS = {
  earth: {
    map: 'textures/earth_day_4096.jpg',
    mapMid: 'textures/earth_day_4096.jpg', // 已是 4096，手机无需再换
    mapHi: 'textures/earth_day_8192.jpg',
    normal: 'textures/earth_normal_2048.jpg',
    specular: 'textures/earth_specular_2048.jpg',
    clouds: 'textures/earth_clouds_2048.jpg',
    night: 'textures/2k_earth_nightmap.jpg',
    atmosColor: [0.32, 0.54, 1.0], atmosStrength: 1.5,
  },
  mars: {
    map: 'textures/mars_2048.jpg',
    mapMid: 'textures/mars_4096.jpg', mapHi: 'textures/mars_hi.jpg',
    atmosColor: [1.0, 0.45, 0.25], atmosStrength: 0.7,
  },
  jupiter: {
    // 源图原生上限即 4096，手机/桌面同档
    map: 'textures/jupiter_2048.jpg',
    mapMid: 'textures/jupiter_hi.jpg', mapHi: 'textures/jupiter_hi.jpg',
    atmosColor: [0.95, 0.80, 0.58], atmosStrength: 0.6,
  },
  venus: {
    map: 'textures/venus_2048.jpg',
    mapMid: 'textures/venus_4096.jpg', mapHi: 'textures/venus_hi.jpg',
    atmosColor: [1.0, 0.85, 0.55], atmosStrength: 1.1,
  },
  saturn: {
    map: 'textures/saturn_2048.jpg',
    mapMid: 'textures/saturn_hi.jpg', mapHi: 'textures/saturn_hi.jpg',
    atmosColor: [0.95, 0.85, 0.62], atmosStrength: 0.6, ring: true,
  },
};
const cfg = PLANETS[planetName] || PLANETS.earth;

const loader = new THREE.TextureLoader();
function srgb(path) {
  const t = loader.load(path);
  t.encoding = THREE.sRGBEncoding;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

// ---------- 星球本体 ----------
const matOpts = { map: srgb(cfg.map) };
if (cfg.normal) {
  matOpts.normalMap = loader.load(cfg.normal);
  matOpts.normalScale = new THREE.Vector2(0.85, 0.85);
}
if (cfg.specular) {
  matOpts.specularMap = loader.load(cfg.specular);
  matOpts.specular = new THREE.Color(0x66788c);
  matOpts.shininess = 22;
} else {
  matOpts.specular = new THREE.Color(0x000000); // 非地球：无镜面，哑光地表
}
// 支点：承载用户拖动产生的转动（自转仍由星球/云层各自绕 y 轴累加）。
// 太阳光在世界坐标，故转动星球时昼夜分界随之移动，符合"地球仪"直觉。
const pivot = new THREE.Group();
scene.add(pivot);

// 128 段：放大后球体轮廓与晨昏线仍平滑（64 段近距可见多边形棱）
const planetMat = new THREE.MeshPhongMaterial(matOpts);
const planet = new THREE.Mesh(new THREE.SphereGeometry(1, 128, 128), planetMat);
pivot.add(planet);

// ---------- 夜光层（仅地球）：背阳面城市灯光 ----------
if (cfg.night) {
  const nightMat = new THREE.ShaderMaterial({
    uniforms: { nightMap: { value: srgb(cfg.night) }, lightDir: { value: sunDir } },
    vertexShader: `
      varying vec2 vUv; varying vec3 vWorldNormal;
      void main() {
        vUv = uv;
        vWorldNormal = normalize(mat3(modelMatrix) * normal);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      uniform sampler2D nightMap; uniform vec3 lightDir;
      varying vec2 vUv; varying vec3 vWorldNormal;
      void main() {
        float night = smoothstep(0.10, -0.22, dot(normalize(vWorldNormal), lightDir));
        gl_FragColor = vec4(texture2D(nightMap, vUv).rgb * night * 1.35, 1.0);
      }`,
    blending: THREE.AdditiveBlending, depthWrite: false, transparent: true,
  });
  const shell = new THREE.Mesh(new THREE.SphereGeometry(1.001, 64, 64), nightMat);
  shell.name = 'night';
  planet.add(shell); // 挂在星球下随其自转
}

// ---------- 云层（仅地球）：独立慢速漂移 ----------
let clouds = null;
if (cfg.clouds) {
  clouds = new THREE.Mesh(
    new THREE.SphereGeometry(1.012, 64, 64),
    new THREE.MeshLambertMaterial({
      map: srgb(cfg.clouds),
      blending: THREE.AdditiveBlending, transparent: true, opacity: 0.55, depthWrite: false,
    })
  );
  pivot.add(clouds); // 随支点一起被拖动，否则云层与地表脱节
}

// ---------- 大气临边辉光：颜色/强度按星球配置 ----------
const atmosphere = new THREE.Mesh(
  new THREE.SphereGeometry(1.09, 64, 64),
  new THREE.ShaderMaterial({
    uniforms: {
      glowColor: { value: new THREE.Vector3(...cfg.atmosColor) },
      strength: { value: cfg.atmosStrength },
    },
    vertexShader: `
      varying vec3 vNormal;
      void main() {
        vNormal = normalize(normalMatrix * normal);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      uniform vec3 glowColor; uniform float strength;
      varying vec3 vNormal;
      void main() {
        float glow = pow(max(0.72 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 0.0), 3.5);
        gl_FragColor = vec4(glowColor * glow * strength, glow * strength);
      }`,
    side: THREE.BackSide, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false,
  })
);
scene.add(atmosphere);

// ---------- 土星环：真 3D 环带（前后遮挡/倾角透视天然成立）+ 真实环带贴图 ----------
let ringOuter = 0;
if (cfg.ring) {
  // 真实半径比（土星赤道半径为 1）：C 环内缘 1.24 → A 环外缘 2.27
  ringOuter = 2.27;
  const ringInner = 1.24;
  // 8192×500 带 alpha 的真实环带图（含卡西尼缝），x 轴 = 内→外半径
  const ringTex = srgb('textures/saturn_ring.png');
  const ringGeo = new THREE.RingGeometry(ringInner, ringOuter, 256, 1);
  const pos = ringGeo.attributes.position;
  const uv = ringGeo.attributes.uv;
  const v = new THREE.Vector3();
  // RingGeometry 的 UV 沿半径方向重映射，使贴图 x 轴对应内→外
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    uv.setXY(i, (v.length() - ringInner) / (ringOuter - ringInner), 0.5);
  }
  const ring = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({
    map: ringTex, side: THREE.DoubleSide, transparent: true, depthWrite: false,
  }));
  ring.rotation.x = Math.PI / 2 - 0.42; // 倾角 ~24°
  ring.rotation.y = 0.18;
  pivot.add(ring); // 环随星球一同被拖动（环面与赤道共面）
}

// 取景距离：土星按环外径框，普通星球按大气壳框。
// 舞台（stage>1）把画布放大同时把镜头等比拉远：初始视觉大小不变，
// 但放大时星球有空间铺开而不会撞到画布方形边缘被裁。
const frameRadius = cfg.ring ? ringOuter * 0.94 : 1.09;
let d0 = 0;
camera.lookAt(0, 0, 0);

// 每次视口尺寸变化都重算取景（不只是 aspect）：
// WebView/iframe 首帧常为 0×0，此时 aspect 为 NaN，
// 若只在加载时算一次 d0，镜头距离将永远是 NaN → 整个场景空白。
let lastW = 0, lastH = 0;
function updateFraming() {
  const w = window.innerWidth, h = window.innerHeight;
  if (!w || !h || (w === lastW && h === lastH)) return;
  lastW = w; lastH = h;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  d0 = fitDistance(frameRadius, stageScale * 1.02);
  camera.position.set(0, 0, d0 / zoom);
}

// ---------- Flutter 控制接口 ----------
window.setSpin = function (revPerSec) { spinRevPerSec = revPerSec; };

// 缩放 = 镜头沿视线推进（dolly），不是位图放大：
// 场景按新距离重新渲染，多近都清晰；镜头恒过原点故星球始终居中。
let zoom = 1, zoomTarget = 1, hiRequested = false;
const lodZoom = 1.35; // 超过此倍率换入放大档地表

// 放大档：手机取 mapMid（≤4096），桌面取 mapHi（源图上限）。
// ?lod=mid|hi 显式指定（移动端 App 壳直接下发，不依赖浏览器嗅探）；
// 缺省时按指针类型判断（Web 版在手机浏览器打开也能自动降档）
const lodParam = params.get('lod');
const useMid = lodParam ? lodParam === 'mid' : isMobileLike;
const lodSrc = useMid ? cfg.mapMid : cfg.mapHi;

// 解码放到主线程之外（createImageBitmap），避免大图解码时整页卡住；
// 换入后立刻释放旧纹理，否则两张贴图同时占显存 → iPhone 卡死
async function loadLodTexture(src) {
  const bitmap = await createImageBitmap(await (await fetch(src)).blob());
  const tex = new THREE.Texture(bitmap);
  tex.encoding = THREE.sRGBEncoding;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  tex.generateMipmaps = false; // 大图 mipmap 再多吃 33% 显存
  tex.minFilter = THREE.LinearFilter;
  tex.needsUpdate = true;
  const old = planetMat.map;
  planetMat.map = tex;
  planetMat.needsUpdate = true;
  if (old) old.dispose();
}

window.setZoom = function (z) {
  zoomTarget = Math.max(1, z);
  if (!hiRequested && lodSrc && lodSrc !== cfg.map && zoomTarget >= lodZoom) {
    hiRequested = true;
    // 失败静默留用常态贴图，不影响交互
    loadLodTexture(lodSrc).catch(function () {});
  }
};

// 拖动转星球（地球仪手感）：Flutter 下发累计的偏航/俯仰角（弧度，绝对值）。
// 支点承载用户转动，星球/云层各自的自转照常叠加在其之上。
let yawTarget = 0, pitchTarget = 0;
const maxPitch = Math.PI / 2 * 0.92; // 别转到极点翻面
window.setRotation = function (yaw, pitch) {
  yawTarget = yaw;
  pitchTarget = Math.max(-maxPitch, Math.min(maxPitch, pitch));
};

let paused = false;
window.pauseRender = function () { paused = true; };
window.resumeRender = function () { paused = false; requestAnimationFrame(animate); };

// Web 端（iframe 跨文档）经 postMessage 调同一组接口
window.addEventListener('message', function (e) {
  const m = e.data;
  if (!m || typeof m !== 'object') return;
  if (typeof m.zoom === 'number') window.setZoom(m.zoom);
  if (typeof m.spin === 'number') window.setSpin(m.spin);
  if (typeof m.yaw === 'number' && typeof m.pitch === 'number') {
    window.setRotation(m.yaw, m.pitch);
  }
});

// ---------- 渲染循环 ----------
let last = performance.now(), frames = 0, lastPost = last, notified = false;
function animate() {
  if (paused) return;
  requestAnimationFrame(animate);
  // 视口尺寸就绪/变化即重算取景（首帧 0×0 的 WebView 也能自愈）
  updateFraming();
  const now = performance.now();
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;
  const w = spinRevPerSec * Math.PI * 2 * dt;
  planet.rotation.y += w;
  if (clouds) clouds.rotation.y += w * 1.18 + 0.00006; // 云层略快于地表
  // 用户拖动的转角平滑趋近（跟手但不生硬）
  const kRot = Math.min(1, dt * 14);
  pivot.rotation.y += (yawTarget - pivot.rotation.y) * kRot;
  pivot.rotation.x += (pitchTarget - pivot.rotation.x) * kRot;
  // 镜头距离平滑趋近目标倍率（指数阻尼，跟手且不抖）
  if (Math.abs(zoomTarget - zoom) > 0.0005) {
    zoom += (zoomTarget - zoom) * Math.min(1, dt * 12);
    camera.position.z = d0 / zoom;
  }
  renderer.render(scene, camera);
  frames++;
  if (now - lastPost > 1000) {
    if (window.SceneBridge) {
      SceneBridge.postMessage(JSON.stringify({
        ready: !notified ? true : undefined,
        fps: Math.round(frames * 1000 / (now - lastPost)),
      }));
      notified = true;
    }
    frames = 0; lastPost = now;
  }
}
updateFraming();
animate();

window.addEventListener('resize', updateFraming);
</script>
</body>
</html>
