<!DOCTYPE html>
<!--
  首页正式 3D 星球场景（阶段八 P2-1，three.js r147 离线打包）
  - 透明背景：星空仍由 Flutter 层（四档银河图）负责，本场景只渲染星球
  - URL 参数初始化：?planet=earth&spin=0.008&stage=3（避免加载时序竞态）
  - Flutter → JS：setSpin(转/秒)、setZoom(倍率)、pauseRender()、resumeRender()
    （移动端 runJavaScript 直调；Web 端 iframe postMessage，见底部 message 监听）
  - JS → Flutter：SceneBridge 通道上报 {ready, fps}
  - 手势全部在 Flutter 层处理（本层 pointer 透明）：缩放经 setZoom 做**镜头推进**，
    而非位图放大——放大后重新渲染，多近都清晰，且镜头恒沿视线故星球始终居中
-->
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: transparent; touch-action: none; }
  canvas { display: block; opacity: 0; transition: opacity 160ms ease-out; }
</style>
</head>
<body>
<script src="three.min.js"></script>
<script>
'use strict';

// ---------- 启动参数 ----------
const params = new URLSearchParams(location.search);
let planetName = params.get('planet') || 'earth';
let spinRevPerSec = parseFloat(params.get('spin') || '0.008');
// 可变：宿主把画布尺寸固定成最大档后，星球间的取景差异靠运行时改 stage 实现
// （改 stage 只重算镜头距离，不动 canvas.width，故不会重分配绘图缓冲）
let stageScale = Math.max(1, parseFloat(params.get('stage') || '1'));
const initialPrewarmPlanets = (params.get('prewarm') || '').split(',').filter(Boolean);

// ---------- 渲染器：透明底叠在 Flutter 星空之上 ----------
const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: true,
  powerPreference: 'high-performance',
});
renderer.setClearColor(0x000000, 0);
// 手机（触屏）常态像素比封 2.5 省电；放大观察时拉满设备像素比（极致清晰），
// 缩回后降回。桌面恒为 3。
const isMobileLike = window.matchMedia('(pointer: coarse)').matches;
const prIdle = Math.min(window.devicePixelRatio, isMobileLike ? 2.5 : 3);
const prZoomed = Math.min(window.devicePixelRatio, 3);
let prCurrent = prIdle;
renderer.setPixelRatio(prIdle);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);

renderer.domElement.addEventListener('webglcontextlost', function (e) {
  e.preventDefault();
  window.pauseRender();
  if (window.parent !== window) {
    window.parent.postMessage('sceneContextLost:' + (params.get('token') || ''), '*');
  }
});
renderer.domElement.addEventListener('webglcontextrestored', function () {
  location.reload();
});

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);

// 取景：星球占满视口短边（Flutter 侧 SizedBox 已按直径定尺寸，土星留环余量）
function fitDistance(radius, margin) {
  const vfov = camera.fov * Math.PI / 180;
  const hfov = 2 * Math.atan(Math.tan(vfov / 2) * camera.aspect);
  return margin * radius / Math.tan(Math.min(vfov, hfov) / 2);
}

// ---------- 光照：主光方向与现有 shader 星球一致（右上前方） ----------
const sunDir = new THREE.Vector3(5, 2, 3).normalize();
const sun = new THREE.DirectionalLight(0xffffff, 1.25);
sun.position.copy(sunDir);
scene.add(sun);
scene.add(new THREE.AmbientLight(0x334455, 0.42));

// ---------- 星球材质组配置 ----------
// LOD 三档：map 常态 / mapMid 手机放大档（6144，显存约 75MB）/
// mapHi 桌面放大档（源图上限）。手机不能上 8192：单张纹理
// 8192×4096×4B ≈ 134MB，iPhone Safari 直接卡死。
const PLANETS = {
  earth: {
    // 常态底图取 2048（解码 8MB，原 4096 要 32MB）：球在屏上只有约 726 设备像素，
    // 可见半球用不到 1024×1024，2048 已远够；放大另有 mapMid/mapHi 高清档接管。
    // 这一刀把地球整套从 64MB 降到 40MB——地球原是"重量级特例"，被纹理缓存挤掉后
    // 退回第一颗星球要整套重载，正是用户实测"逆序 2→1 有异常"的原因。
    map: 'textures/earth_day_2048.jpg',
    mapMid: 'textures/earth_day_6144.jpg',
    mapHi: 'textures/earth_day_8192.jpg',
    normal: 'textures/earth_normal_2048.jpg',
    specular: 'textures/earth_specular_2048.jpg',
    clouds: 'textures/earth_clouds_2048.jpg',
    night: 'textures/2k_earth_nightmap.jpg',
    atmosColor: [0.32, 0.54, 1.0], atmosStrength: 1.5,
  },
  mars: {
    map: 'textures/mars_2048.jpg',
    mapMid: 'textures/mars_6144.jpg', mapHi: 'textures/mars_hi.jpg',
    atmosColor: [1.0, 0.45, 0.25], atmosStrength: 0.7,
  },
  jupiter: {
    // 源图原生上限即 4096，手机/桌面同档
    map: 'textures/jupiter_2048.jpg',
    mapMid: 'textures/jupiter_hi.jpg', mapHi: 'textures/jupiter_hi.jpg',
    atmosColor: [0.95, 0.80, 0.58], atmosStrength: 0.6,
  },
  venus: {
    map: 'textures/venus_2048.jpg',
    mapMid: 'textures/venus_6144.jpg', mapHi: 'textures/venus_hi.jpg',
    atmosColor: [1.0, 0.85, 0.55], atmosStrength: 1.1,
  },
  saturn: {
    map: 'textures/saturn_2048.jpg',
    mapMid: 'textures/saturn_hi.jpg', mapHi: 'textures/saturn_hi.jpg',
    atmosColor: [0.95, 0.85, 0.62], atmosStrength: 0.6, ring: true,
  },
};
let cfg = PLANETS[planetName] || PLANETS.earth;

const loader = new THREE.TextureLoader();
let baseTextureReady = false;
function srgb(path, critical = false) {
  const markReady = function () {
    if (critical) baseTextureReady = true;
  };
  const t = loader.load(path, markReady, undefined, markReady);
  t.encoding = THREE.sRGBEncoding;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

// ---------- 支点 + 大气壳：星球无关，只建一次；换星球只换本体贴图不重建 ----------
// 支点承载用户拖动产生的转动；太阳光在世界坐标，转星球时昼夜分界随之移动。
const pivot = new THREE.Group();
scene.add(pivot);

// 大气临边辉光：几何与星球无关，颜色/强度按星球更新 uniforms
const atmosphere = new THREE.Mesh(
  new THREE.SphereGeometry(1.09, 64, 64),
  new THREE.ShaderMaterial({
    uniforms: {
      glowColor: { value: new THREE.Vector3(...cfg.atmosColor) },
      strength: { value: cfg.atmosStrength },
    },
    vertexShader: `
      varying vec3 vNormal;
      void main() {
        vNormal = normalize(normalMatrix * normal);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      uniform vec3 glowColor; uniform float strength;
      varying vec3 vNormal;
      void main() {
        float glow = pow(max(0.72 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 0.0), 3.5);
        gl_FragColor = vec4(glowColor * glow * strength, glow * strength);
      }`,
    side: THREE.BackSide, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false,
  })
);
scene.add(atmosphere);

// 放大档档位偏好（手机 mapMid=6144，桌面 mapHi）——切星球时同样据此选高清源
const lodParam = params.get('lod');
const useMidLod = lodParam ? lodParam === 'mid' : isMobileLike;
const detailZoomStart = 1.35, detailZoomFull = 2.85;

// 夜光层材质（仅地球）：背阳面城市灯光
function makeNightMat(nightMap) {
  return new THREE.ShaderMaterial({
    uniforms: { nightMap: { value: nightMap }, lightDir: { value: sunDir } },
    vertexShader: `
      varying vec2 vUv; varying vec3 vWorldNormal;
      void main() {
        vUv = uv;
        vWorldNormal = normalize(mat3(modelMatrix) * normal);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      uniform sampler2D nightMap; uniform vec3 lightDir;
      varying vec2 vUv; varying vec3 vWorldNormal;
      void main() {
        float night = smoothstep(0.10, -0.22, dot(normalize(vWorldNormal), lightDir));
        gl_FragColor = vec4(texture2D(nightMap, vUv).rgb * night * 1.35, 1.0);
      }`,
    blending: THREE.AdditiveBlending, depthWrite: false, transparent: true,
  });
}

// 建一颗星球（本体+夜光+云+环），加入 pivot，更新大气 uniforms，返回派生的
// LOD/取景值。pre 非空时用**预加载好的纹理**——切星球时旧星球先继续渲染，
// 新贴图全部就绪后由本函数一次性接管，全程复用同一 renderer / canvas / context。
// pre 一定是整套（见 loadPlanetTextureBundle）：曾试过"先底图、细节后补"两相，
// 但只有地球有细节图，结果换到地球时肉眼可见两级跳，已废弃。
function mountPlanet(pcfg, pre) {
  const has = pre ? function (k) { return !!pre[k]; } : function () { return true; };
  const tex = function (k, path, isSrgb) {
    if (pre) return pre[k];
    return isSrgb ? srgb(path) : loader.load(path);
  };
  const matOpts = { map: pre ? pre.map : srgb(pcfg.map, true) };
  if (pcfg.normal && has('normal')) {
    matOpts.normalMap = tex('normal', pcfg.normal, false);
    matOpts.normalScale = new THREE.Vector2(0.85, 0.85);
  }
  if (pcfg.specular && has('specular')) {
    matOpts.specularMap = tex('specular', pcfg.specular, false);
    matOpts.specular = new THREE.Color(0x66788c);
    matOpts.shininess = 22;
  } else {
    matOpts.specular = new THREE.Color(0x000000); // 非地球/细节未到：哑光地表
  }
  const pmat = new THREE.MeshPhongMaterial(matOpts);
  // 128 段：放大后球体轮廓与晨昏线仍平滑（64 段近距可见多边形棱）
  const pmesh = new THREE.Mesh(new THREE.SphereGeometry(1, 128, 128), pmat);
  pivot.add(pmesh);

  let night = null;
  if (pcfg.night && has('night')) {
    night = new THREE.Mesh(
      new THREE.SphereGeometry(1.001, 64, 64),
      makeNightMat(tex('night', pcfg.night, true))
    );
    night.name = 'night';
    pmesh.add(night); // 挂在星球下随其自转
  }

  let cl = null;
  if (pcfg.clouds && has('clouds')) {
    cl = new THREE.Mesh(
      new THREE.SphereGeometry(1.012, 64, 64),
      new THREE.MeshLambertMaterial({
        map: tex('clouds', pcfg.clouds, true),
        blending: THREE.AdditiveBlending, transparent: true, opacity: 0.55, depthWrite: false,
      })
    );
    pivot.add(cl); // 随支点一起被拖动，否则云层与地表脱节
  }

  let rg = null, rOuter = 0;
  if (pcfg.ring) {
    // 真实半径比（土星赤道半径为 1）：C 环内缘 1.24 → A 环外缘 2.27
    rOuter = 2.27;
    const ringInner = 1.24;
    const ringTex = pre ? pre.ring : srgb('textures/saturn_ring.png');
    const ringGeo = new THREE.RingGeometry(ringInner, rOuter, 256, 1);
    const pos = ringGeo.attributes.position;
    const uv = ringGeo.attributes.uv;
    const vv = new THREE.Vector3();
    // RingGeometry 的 UV 沿半径方向重映射，使贴图 x 轴对应内→外
    for (let i = 0; i < pos.count; i++) {
      vv.fromBufferAttribute(pos, i);
      uv.setXY(i, (vv.length() - ringInner) / (rOuter - ringInner), 0.5);
    }
    rg = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({
      map: ringTex, side: THREE.DoubleSide, transparent: true, depthWrite: false,
    }));
    rg.rotation.x = Math.PI / 2 - 0.42; // 倾角 ~24°
    rg.rotation.y = 0.18;
    pivot.add(rg); // 环随星球一同被拖动（环面与赤道共面）
  }

  atmosphere.material.uniforms.glowColor.value.set(
    pcfg.atmosColor[0], pcfg.atmosColor[1], pcfg.atmosColor[2]);
  atmosphere.material.uniforms.strength.value = pcfg.atmosStrength;

  return {
    planet: pmesh, planetMat: pmat, clouds: cl, nightShell: night, ring: rg,
    ringOuter: rOuter,
    frameRadius: pcfg.ring ? rOuter * 0.94 : 1.09,
    baseTex: pmat.map,
    lodSrc: useMidLod ? pcfg.mapMid : pcfg.mapHi,
    detailBaseNormalScale: pcfg.normal ? 0.85 : 0,
    detailBaseShininess: pmat.shininess,
  };
}

// 拆一颗星球：从 pivot 摘除并释放其几何/材质；keepTex 为真时贴图不销毁
// （由调用方回存 planetTextureCache，滑回该星球零加载零上传）。
// 缩放态残留的 hiTex 不进缓存，一律释放。
function unmountPlanet(b, keepTex) {
  if (b.planet) {
    pivot.remove(b.planet);
    b.planet.geometry.dispose();
    const m = b.planet.material.map;
    if (m && m !== b.baseTex) m.dispose(); // 缩放态残留的 hiTex
    if (!keepTex) {
      if (b.planet.material.normalMap) b.planet.material.normalMap.dispose();
      if (b.planet.material.specularMap) b.planet.material.specularMap.dispose();
    }
    b.planet.material.dispose();
  }
  if (!keepTex && b.baseTex) b.baseTex.dispose();
  if (b.nightShell) {
    b.nightShell.geometry.dispose();
    if (!keepTex) {
      const nm = b.nightShell.material.uniforms.nightMap.value;
      if (nm) nm.dispose();
    }
    b.nightShell.material.dispose();
  }
  if (b.clouds) {
    pivot.remove(b.clouds);
    b.clouds.geometry.dispose();
    if (!keepTex && b.clouds.material.map) b.clouds.material.map.dispose();
    b.clouds.material.dispose();
  }
  if (b.ring) {
    pivot.remove(b.ring);
    b.ring.geometry.dispose();
    if (!keepTex && b.ring.material.map) b.ring.material.map.dispose();
    b.ring.material.dispose();
  }
}

// 首屏星球（同步创建；贴图异步加载，baseTextureReady 就绪后动画循环才揭幕）
let parts = mountPlanet(cfg);
let planet = parts.planet;
let planetMat = parts.planetMat;
let clouds = parts.clouds;
let nightShell = parts.nightShell;
let ring = parts.ring;
let ringOuter = parts.ringOuter;
let baseTex = parts.baseTex;
let lodSrc = parts.lodSrc;
let detailBaseNormalScale = parts.detailBaseNormalScale;
let detailBaseShininess = parts.detailBaseShininess;

// 取景距离：土星按环外径框，普通星球按大气壳框。
// 舞台（stage>1）把画布放大同时把镜头等比拉远：初始视觉大小不变，
// 但放大时星球有空间铺开而不会撞到画布方形边缘被裁。
let frameRadius = parts.frameRadius;
let d0 = 0;
camera.lookAt(0, 0, 0);

// 每次视口尺寸变化都重算取景（不只是 aspect）：
// WebView/iframe 首帧常为 0×0，此时 aspect 为 NaN，
// 若只在加载时算一次 d0，镜头距离将永远是 NaN → 整个场景空白。
let lastW = 0, lastH = 0;
function updateFraming() {
  const w = window.innerWidth, h = window.innerHeight;
  if (!w || !h || (w === lastW && h === lastH)) return;
  lastW = w; lastH = h;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  d0 = fitDistance(frameRadius, stageScale * 1.02);
  camera.position.set(0, 0, d0 / zoom);
}

// ---------- Flutter 控制接口 ----------
window.setSpin = function (revPerSec) { spinRevPerSec = revPerSec; };

/// 改取景倍率（画布尺寸不变）：只重算镜头距离，**不碰 canvas.width**，
/// 因此不会像 renderer.setSize 那样重分配绘图缓冲、闪一下。
window.setStage = function (s) {
  const v = Math.max(1, s);
  if (!isFinite(v) || v === stageScale) return;
  stageScale = v;
  if (lastW > 0 && lastH > 0) {
    d0 = fitDistance(frameRadius, stageScale * 1.02);
    camera.position.set(0, 0, d0 / zoom);
  }
};

// 缩放 = 镜头沿视线推进（dolly），不是位图放大：
// 场景按新距离重新渲染，多近都清晰；镜头恒过原点故星球始终居中。
let zoom = 1, zoomTarget = 1;

function applySurfaceDetail() {
  const t = Math.max(0, Math.min(1, (zoomTarget - detailZoomStart) / (detailZoomFull - detailZoomStart)));
  if (cfg.normal && planetMat.normalScale) {
    const s = detailBaseNormalScale * (1 + t * 0.55);
    planetMat.normalScale.set(s, s);
  }
  if (cfg.specular) {
    planetMat.shininess = detailBaseShininess + t * 18;
  }
}

// 放大档源（mapMid/mapHi）由 mountPlanet 按 useMidLod 选好放进 lodSrc；
// baseTex（常态贴图）与 lodSrc 都在换星球时随 mountPlanet 重新赋值。

// LOD 迟滞切换：缩放刚开始先预热，真正放大过 lodZoomIn 才换高清档；
// 缩回 lodZoomOut 以下不立刻收尾，而是延迟降档/释放，避免手势中来回重配画布。
const lodPrewarmZoom = 1.06, lodZoomIn = 1.35, lodZoomOut = 1.15;
const lodSettleDelayMs = 700, lodDisposeDelayMs = 8000;
// 可见场景零后台重活（2026-07-15 定稿）：切球完成后**不再有任何自动高清
// 预热线**。只要后台还允许偷偷做高清解码/GPU 上传/DPR setSize，就一定会在
// 某些 iPhone/Safari 时机下短顿——区别只是早晚和明显程度。高清 LOD 只在
// 用户明确放大（applyLod 手势路径）时进入。
let hiTex = null, hiLoading = false, hiPrewarmRequested = false;
let lodSettleTimer = 0, lodDisposeTimer = 0;

// Safari/WKWebView 没有 requestIdleCallback，旧退化 setTimeout(350) 是"固定延时"
// 而非"空闲"——iPhone 上常正撞滑页收尾动画（星球+星空+标题一起冻）。改为静默期
// 调度：距最近一次交互/切球消息 ≥ 800ms 才执行；久等不到静默则 4s 兜底强制执行
// （对齐 requestIdleCallback 的 timeout 语义，保证任务不会饿死）。
let lastActivityTs = performance.now();
function noteActivity() { lastActivityTs = performance.now(); }
function runWhenQuiet(task, quietMs, timeoutMs) {
  quietMs = quietMs || 450;
  timeoutMs = timeoutMs || 4000;
  const start = performance.now();
  const waitForQuiet = function () {
    if (performance.now() - lastActivityTs >= quietMs || performance.now() - start >= timeoutMs) {
      runWhenIdle(task);
      return;
    }
    setTimeout(waitForQuiet, 150);
  };
  setTimeout(waitForQuiet, quietMs);
}
function runWhenIdle(task) {
  if ('requestIdleCallback' in window) {
    window.requestIdleCallback(task, { timeout: 1800 });
    return;
  }
  const deadline = performance.now() + 4000;
  const tryRun = function () {
    if (performance.now() - lastActivityTs >= 800 || performance.now() >= deadline) {
      task();
      return;
    }
    setTimeout(tryRun, 250);
  };
  setTimeout(tryRun, 350);
}

function cancelLodTimers() {
  if (lodSettleTimer) {
    clearTimeout(lodSettleTimer);
    lodSettleTimer = 0;
  }
  if (lodDisposeTimer) {
    clearTimeout(lodDisposeTimer);
    lodDisposeTimer = 0;
  }
}

// —— GPU 上传调度器（TextureUploadScheduler）——
// 原则：**交互期间绝不做重 GPU 工作**。手指下的帧只允许改镜头，
// initTexture 大分配 / copyTextureToTexture 大分块 / setPixelRatio+setSize
// 重分配画布，全部排进这个按帧预算的串行队列：
// - 距最近输入 < uploadInteractGuardMs 视为交互中 → 这帧让路，下帧再试；
// - 持续交互超过 uploadSlotMaxWaitMs 仍推进一小步（块已自适应到很小，
//   防止连续滑页/转球把切球事务饿死）；
// - 块大小按实测耗时自适应：>6ms 减半、<3ms 加倍，稳定收敛到本机
//   "一帧塞得下"的尺寸。高清晚一点到，但手势永远丝滑。
let gpuUploadChain = Promise.resolve();
const uploadInteractGuardMs = 200;
const uploadSlotMaxWaitMs = 1000;
let adaptiveBandBytes = 2 * 1024 * 1024; // 初始 2MB/块
const bandBytesMin = 256 * 1024, bandBytesMax = 8 * 1024 * 1024;
function tuneUploadBudget(costMs) {
  if (costMs > 6) {
    adaptiveBandBytes = Math.max(bandBytesMin, adaptiveBandBytes >> 1);
  } else if (costMs < 3) {
    adaptiveBandBytes = Math.min(bandBytesMax, adaptiveBandBytes * 2);
  }
}
function nextFrameTick() {
  return new Promise(function (resolve) {
    let done = false;
    const finish = function () { if (!done) { done = true; resolve(); } };
    requestAnimationFrame(finish);

    // 拆旧星球：几何/材质释放，贴图保留（已回存缓存，滑回即刻接管）
    unmountPlanet(old, true);
    // 新星球的高清档只预取字节（不解码、不上传、不动画布）：第一次放大不等文件
    prefetchTexturePath(lodSrc);
    planetSwapping = false;
    // 通知宿主：新星球已接管（宿主据此确认切换完成）
    if (window.parent !== window) {
      // 带上接管后的星球名：宿主只在"场景真正换到当前页星球"时才揭幕替身，
      // 否则快速新建时串行换球滞后，替身会淡出到滞后的错星球（先出地球/小土星）。
      window.parent.postMessage('planetReady:' + (params.get('token') || '') + ':' + planetName, '*');
    }
    // 若途中又指定了新目标，接着换
    if (pendingPlanet && pendingPlanet !== planetName) {
      const pp = pendingPlanet; pendingPlanet = null; window.setPlanet(pp);
    } else {
      pendingPlanet = null;
    }
  }).catch(function () { planetSwapping = false; });
};

// Web 端（iframe 跨文档）经 postMessage 调同一组接口
window.addEventListener('message', function (e) {
  const m = e.data;
  if (!m || typeof m !== 'object') return;
  // 同一条消息里带了 planet 时**不能**提前改 stage：换球要 60~100ms，期间画面还是
  // 旧星球，提前套上新取景会把旧星球放大/缩小（用户实测"先出现变大的金星"）。
  // 这种情况交给 setPlanet 在接管新贴图的同一刻原子生效（见其 state.stage 处理）。
  if (typeof m.stage === 'number' && typeof m.planet !== 'string') {
    window.setStage(m.stage);
  }
  if (typeof m.planet === 'string') window.setPlanet(m.planet, m);
  if (typeof m.zoom === 'number') window.setZoom(m.zoom);
  if (typeof m.spin === 'number') window.setSpin(m.spin);
  if (Array.isArray(m.prewarmPlanets)) window.prewarmPlanets(m.prewarmPlanets);
  if (typeof m.yaw === 'number' && typeof m.pitch === 'number') {
    window.setRotation(m.yaw, m.pitch);
  }
  // 宿主请求式快照（进大纲前拍一张，供返回时替身用）
  if (typeof m.snapshot === 'number') sendSnapshot();
  // 非当前星球页暂停渲染：滑过的页被 keepAlive 后 iframe 仍在后台
  // rAF 渲染，多球常驻会越用越卡（用户实测"一段时间后变卡"）
  if (typeof m.render === 'number') {
    if (m.render > 0) { window.resumeRender(); } else { window.pauseRender(); }
  }
  if (typeof m.dispose === 'number') disposeScene();
});

function sendSnapshot() {
  if (window.parent === window) return;
  try {
    const source = renderer.domElement;
    if (!source.width || !source.height) return;
    const maxSide = 480;
    const scale = Math.min(1, maxSide / Math.max(source.width, source.height));
    const w = Math.max(1, Math.round(source.width * scale));
    const h = Math.max(1, Math.round(source.height * scale));
    const canvas = document.createElement('canvas');
    canvas.width = w;
    canvas.height = h;
    canvas.getContext('2d').drawImage(source, 0, 0, w, h);
    window.parent.postMessage(
      'sceneSnapshot:' + (params.get('token') || '') + ':' +
        canvas.toDataURL('image/png'),
      '*'
    );
  } catch (e) {
    // WebGL 画布若被浏览器保护为不可读，快照兜底静默放弃，不影响真实场景渲染。
  }
}

// ---------- 渲染循环 ----------
let last = performance.now(), frames = 0, lastPost = last, notified = false;
function animate() {
  rafId = 0;
  if (paused || disposed) return;
  requestNextFrame();
  // 视口尺寸就绪/变化即重算取景（首帧 0×0 的 WebView 也能自愈）
  updateFraming();
  const now = performance.now();
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;
  const w = spinRevPerSec * Math.PI * 2 * dt;
  planet.rotation.y += w;
  if (clouds) clouds.rotation.y += w * 1.18 + 0.00006; // 云层略快于地表
  // 用户拖动的转角平滑趋近（跟手但不生硬）
  const kRot = Math.min(1, dt * 14);
  pivot.rotation.y += (yawTarget - pivot.rotation.y) * kRot;
  pivot.rotation.x += (pitchTarget - pivot.rotation.x) * kRot;
  // 镜头距离平滑趋近目标倍率（指数阻尼，跟手且不抖）
  if (Math.abs(zoomTarget - zoom) > 0.0005) {
    zoom += (zoomTarget - zoom) * Math.min(1, dt * 12);
    camera.position.z = d0 / zoom;
  }
  renderer.render(scene, camera);
  frames++;
  // 首帧真实渲染后立刻通知宿主"场景就绪"：宿主用它把加载期的
  // 星球替身淡出（返回首页时 iframe 重建约 1 秒，替身盖住空白期）
  if (!notified && lastW > 0) {
    if (!baseTextureReady) return;
    notified = true;
    renderer.domElement.style.opacity = '1';
    if (window.SceneBridge) {
      SceneBridge.postMessage(JSON.stringify({ ready: true, planet: planetName }));
    }
    if (window.parent !== window) {
      // 带回宿主下发的 token + 当前星球名：同页多颗星球各认自己的就绪信号，
      // 且宿主据星球名判断"场景已换到当前页星球"才揭幕
      window.parent.postMessage('sceneReady:' + (params.get('token') || '') + ':' + planetName, '*');
      // 就绪拍一张兜底快照。不做周期快照：toDataURL 的 PNG 编码在
      // 主线程（约 20-50ms），每 5 秒一次固定 jank（用户实测"会变卡"）；
      // 之后由宿主在进大纲前请求最新一张（message.snapshot）
      sendSnapshot();
    }
  }
  if (now - lastPost > 1000) {
    const fps = Math.round(frames * 1000 / (now - lastPost));
    if (window.SceneBridge) {
      SceneBridge.postMessage(JSON.stringify({ fps: fps }));
    }
    // 心跳：本行**只有真正渲染出帧才会执行**（在 render 之后）。宿主据此判活：
    // 心跳断了就说明画面冻结（丢 WebGL 上下文 / 渲染循环抛错），需要重建场景。
    // 用户实测：iPhone 上星球会卡死不动，且丢上下文后旧实现永远停在最后一帧。
    if (window.parent !== window) {
      window.parent.postMessage('sceneAlive:' + (params.get('token') || '') + ':' + fps, '*');
    }
    frames = 0; lastPost = now;
  }
}
updateFraming();
requestNextFrame();
// 首屏星球的高清档同样只预取字节（第一次放大不等文件读取）
prefetchTexturePath(lodSrc);
if (initialPrewarmPlanets.length) {
  setTimeout(function () { window.prewarmPlanets(initialPrewarmPlanets); }, 600);
}

window.addEventListener('resize', updateFraming);

function disposeScene() {
  if (disposed) return;
  disposed = true;
  window.pauseRender();
  cancelLodTimers();
  planetTextureCache.forEach(function (record) {
    disposeTextureBundle(record.bundle);
  });
  planetTextureCache.clear();
  window.removeEventListener('resize', updateFraming);
  if (hiTex) hiTex.dispose();
  if (baseTex) baseTex.dispose();
  if (clouds?.material?.map) clouds.material.map.dispose();
  planet.geometry.dispose();
  planet.material.dispose();
  if (clouds) {
    clouds.geometry.dispose();
    clouds.material.dispose();
  }
  atmosphere.geometry.dispose();
  atmosphere.material.dispose();
  renderer.dispose();
  renderer.domElement.remove();
}
window.addEventListener('pagehide', disposeScene);
window.addEventListener('beforeunload', disposeScene);

// ---------- 自检（?selftest=1）：serve_web.ps1 每次构建后用无头浏览器跑 ----------
// 真实调用一遍核心链路（缩放/postMessage 旋转/LOD 换档），结果写进 <title>，
// 防止"改完代码后缩放/旋转悄悄失效"这类回归溜到手机上才被发现
if (params.get('selftest') === '1') {
  setTimeout(async function () {
    const fails = [];
    try {
      const z0 = camera.position.z;
      window.setZoom(2);
      await new Promise(function (r) { setTimeout(r, 700); });
      if (!(camera.position.z < z0 * 0.75)) fails.push('zoom');
      if (!(hiTex || hiLoading)) fails.push('lod');
      window.postMessage({ yaw: 0.8, pitch: 0.2 }, '*');
      await new Promise(function (r) { setTimeout(r, 700); });
      if (Math.abs(pivot.rotation.y - 0.8) > 0.2) fails.push('rotate');
      // 切星球：原地换贴图（不重载）。校验换成后 planetName 更新、仍单 canvas、
      // 且沿用当前缩放（不复位）——覆盖"变脸/多 context/默认角度"回归。
      const canvasBefore = document.querySelectorAll('canvas').length;
      window.postMessage({ planet: 'mars' }, '*');
      await new Promise(function (r) { setTimeout(r, 1600); });
      if (planetName !== 'mars') fails.push('setPlanet');
      if (document.querySelectorAll('canvas').length !== canvasBefore) fails.push('multicanvas');
      if (zoomTarget < 1.5) fails.push('zoomkept');
    } catch (e) {
      fails.push('error:' + e.message);
    }
    document.title = fails.length ? 'SELFTEST_FAIL:' + fails.join('+') : 'SELFTEST_PASS';
  }, 1200);
}
</script>
</body>
</html>
