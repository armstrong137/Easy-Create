<!DOCTYPE html>
<!--
  首页正式 3D 星球场景（阶段八 P2-1，three.js r147 离线打包）
  - 透明背景：星空仍由 Flutter 层（四档银河图）负责，本场景只渲染星球
  - URL 参数初始化：?planet=earth&spin=0.008&stage=3（避免加载时序竞态）
  - Flutter → JS：setSpin(转/秒)、setZoom(倍率)、pauseRender()、resumeRender()
    （移动端 runJavaScript 直调；Web 端 iframe postMessage，见底部 message 监听）
  - JS → Flutter：SceneBridge 通道上报 {ready, fps}
  - 手势全部在 Flutter 层处理（本层 pointer 透明）：缩放经 setZoom 做**镜头推进**，
    而非位图放大——放大后重新渲染，多近都清晰，且镜头恒沿视线故星球始终居中
-->
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: transparent; touch-action: none; }
  canvas { display: block; opacity: 0; transition: opacity 160ms ease-out; }
</style>
</head>
<body>
<script src="three.min.js"></script>
<script>
'use strict';

// ---------- 启动参数 ----------
const params = new URLSearchParams(location.search);
const planetName = params.get('planet') || 'earth';
let spinRevPerSec = parseFloat(params.get('spin') || '0.008');
const stageScale = Math.max(1, parseFloat(params.get('stage') || '1'));
let autoPrewarmEnabled = params.get('autoPrewarm') !== '0';

// ---------- 渲染器：透明底叠在 Flutter 星空之上 ----------
const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: true,
  powerPreference: 'high-performance',
});
renderer.setClearColor(0x000000, 0);
// 手机（触屏）常态像素比封 2.5 省电；放大观察时拉满设备像素比（极致清晰），
// 缩回后降回。桌面恒为 3。
const isMobileLike = window.matchMedia('(pointer: coarse)').matches;
const prIdle = Math.min(window.devicePixelRatio, isMobileLike ? 2.5 : 3);
const prZoomed = Math.min(window.devicePixelRatio, 3);
let prCurrent = prIdle;
renderer.setPixelRatio(prIdle);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);

// 取景：星球占满视口短边（Flutter 侧 SizedBox 已按直径定尺寸，土星留环余量）
function fitDistance(radius, margin) {
  const vfov = camera.fov * Math.PI / 180;
  const hfov = 2 * Math.atan(Math.tan(vfov / 2) * camera.aspect);
  return margin * radius / Math.tan(Math.min(vfov, hfov) / 2);
}

// ---------- 光照：主光方向与现有 shader 星球一致（右上前方） ----------
const sunDir = new THREE.Vector3(5, 2, 3).normalize();
const sun = new THREE.DirectionalLight(0xffffff, 1.25);
sun.position.copy(sunDir);
scene.add(sun);
scene.add(new THREE.AmbientLight(0x334455, 0.42));

// ---------- 星球材质组配置 ----------
// LOD 三档：map 常态 / mapMid 手机放大档（6144，显存约 75MB）/
// mapHi 桌面放大档（源图上限）。手机不能上 8192：单张纹理
// 8192×4096×4B ≈ 134MB，iPhone Safari 直接卡死。
const PLANETS = {
  earth: {
    map: 'textures/earth_day_4096.jpg',
    mapMid: 'textures/earth_day_6144.jpg',
    mapHi: 'textures/earth_day_8192.jpg',
    normal: 'textures/earth_normal_2048.jpg',
    specular: 'textures/earth_specular_2048.jpg',
    clouds: 'textures/earth_clouds_2048.jpg',
    night: 'textures/2k_earth_nightmap.jpg',
    atmosColor: [0.32, 0.54, 1.0], atmosStrength: 1.5,
  },
  mars: {
    map: 'textures/mars_2048.jpg',
    mapMid: 'textures/mars_6144.jpg', mapHi: 'textures/mars_hi.jpg',
    atmosColor: [1.0, 0.45, 0.25], atmosStrength: 0.7,
  },
  jupiter: {
    // 源图原生上限即 4096，手机/桌面同档
    map: 'textures/jupiter_2048.jpg',
    mapMid: 'textures/jupiter_hi.jpg', mapHi: 'textures/jupiter_hi.jpg',
    atmosColor: [0.95, 0.80, 0.58], atmosStrength: 0.6,
  },
  venus: {
    map: 'textures/venus_2048.jpg',
    mapMid: 'textures/venus_6144.jpg', mapHi: 'textures/venus_hi.jpg',
    atmosColor: [1.0, 0.85, 0.55], atmosStrength: 1.1,
  },
  saturn: {
    map: 'textures/saturn_2048.jpg',
    mapMid: 'textures/saturn_hi.jpg', mapHi: 'textures/saturn_hi.jpg',
    atmosColor: [0.95, 0.85, 0.62], atmosStrength: 0.6, ring: true,
  },
};
const cfg = PLANETS[planetName] || PLANETS.earth;

const loader = new THREE.TextureLoader();
let baseTextureReady = false;
function srgb(path, critical = false) {
  const markReady = function () {
    if (critical) baseTextureReady = true;
  };
  const t = loader.load(path, markReady, undefined, markReady);
  t.encoding = THREE.sRGBEncoding;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

// ---------- 星球本体 ----------
const matOpts = { map: srgb(cfg.map, true) };
if (cfg.normal) {
  matOpts.normalMap = loader.load(cfg.normal);
  matOpts.normalScale = new THREE.Vector2(0.85, 0.85);
}
if (cfg.specular) {
  matOpts.specularMap = loader.load(cfg.specular);
  matOpts.specular = new THREE.Color(0x66788c);
  matOpts.shininess = 22;
} else {
  matOpts.specular = new THREE.Color(0x000000); // 非地球：无镜面，哑光地表
}
// 支点：承载用户拖动产生的转动（自转仍由星球/云层各自绕 y 轴累加）。
// 太阳光在世界坐标，故转动星球时昼夜分界随之移动，符合"地球仪"直觉。
const pivot = new THREE.Group();
scene.add(pivot);

// 128 段：放大后球体轮廓与晨昏线仍平滑（64 段近距可见多边形棱）
const planetMat = new THREE.MeshPhongMaterial(matOpts);
const detailBaseNormalScale = cfg.normal && planetMat.normalScale ? planetMat.normalScale.x : 0;
const detailBaseShininess = planetMat.shininess;
const detailZoomStart = 1.35, detailZoomFull = 2.85;
const planet = new THREE.Mesh(new THREE.SphereGeometry(1, 128, 128), planetMat);
pivot.add(planet);

// ---------- 夜光层（仅地球）：背阳面城市灯光 ----------
if (cfg.night) {
  const nightMat = new THREE.ShaderMaterial({
    uniforms: { nightMap: { value: srgb(cfg.night) }, lightDir: { value: sunDir } },
    vertexShader: `
      varying vec2 vUv; varying vec3 vWorldNormal;
      void main() {
        vUv = uv;
        vWorldNormal = normalize(mat3(modelMatrix) * normal);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      uniform sampler2D nightMap; uniform vec3 lightDir;
      varying vec2 vUv; varying vec3 vWorldNormal;
      void main() {
        float night = smoothstep(0.10, -0.22, dot(normalize(vWorldNormal), lightDir));
        gl_FragColor = vec4(texture2D(nightMap, vUv).rgb * night * 1.35, 1.0);
      }`,
    blending: THREE.AdditiveBlending, depthWrite: false, transparent: true,
  });
  const shell = new THREE.Mesh(new THREE.SphereGeometry(1.001, 64, 64), nightMat);
  shell.name = 'night';
  planet.add(shell); // 挂在星球下随其自转
}

// ---------- 云层（仅地球）：独立慢速漂移 ----------
let clouds = null;
if (cfg.clouds) {
  clouds = new THREE.Mesh(
    new THREE.SphereGeometry(1.012, 64, 64),
    new THREE.MeshLambertMaterial({
      map: srgb(cfg.clouds),
      blending: THREE.AdditiveBlending, transparent: true, opacity: 0.55, depthWrite: false,
    })
  );
  pivot.add(clouds); // 随支点一起被拖动，否则云层与地表脱节
}

// ---------- 大气临边辉光：颜色/强度按星球配置 ----------
const atmosphere = new THREE.Mesh(
  new THREE.SphereGeometry(1.09, 64, 64),
  new THREE.ShaderMaterial({
    uniforms: {
      glowColor: { value: new THREE.Vector3(...cfg.atmosColor) },
      strength: { value: cfg.atmosStrength },
    },
    vertexShader: `
      varying vec3 vNormal;
      void main() {
        vNormal = normalize(normalMatrix * normal);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      uniform vec3 glowColor; uniform float strength;
      varying vec3 vNormal;
      void main() {
        float glow = pow(max(0.72 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 0.0), 3.5);
        gl_FragColor = vec4(glowColor * glow * strength, glow * strength);
      }`,
    side: THREE.BackSide, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false,
  })
);
scene.add(atmosphere);

// ---------- 土星环：真 3D 环带（前后遮挡/倾角透视天然成立）+ 真实环带贴图 ----------
let ringOuter = 0;
if (cfg.ring) {
  // 真实半径比（土星赤道半径为 1）：C 环内缘 1.24 → A 环外缘 2.27
  ringOuter = 2.27;
  const ringInner = 1.24;
  // 8192×500 带 alpha 的真实环带图（含卡西尼缝），x 轴 = 内→外半径
  const ringTex = srgb('textures/saturn_ring.png');
  const ringGeo = new THREE.RingGeometry(ringInner, ringOuter, 256, 1);
  const pos = ringGeo.attributes.position;
  const uv = ringGeo.attributes.uv;
  const v = new THREE.Vector3();
  // RingGeometry 的 UV 沿半径方向重映射，使贴图 x 轴对应内→外
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    uv.setXY(i, (v.length() - ringInner) / (ringOuter - ringInner), 0.5);
  }
  const ring = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({
    map: ringTex, side: THREE.DoubleSide, transparent: true, depthWrite: false,
  }));
  ring.rotation.x = Math.PI / 2 - 0.42; // 倾角 ~24°
  ring.rotation.y = 0.18;
  pivot.add(ring); // 环随星球一同被拖动（环面与赤道共面）
}

// 取景距离：土星按环外径框，普通星球按大气壳框。
// 舞台（stage>1）把画布放大同时把镜头等比拉远：初始视觉大小不变，
// 但放大时星球有空间铺开而不会撞到画布方形边缘被裁。
const frameRadius = cfg.ring ? ringOuter * 0.94 : 1.09;
let d0 = 0;
camera.lookAt(0, 0, 0);

// 每次视口尺寸变化都重算取景（不只是 aspect）：
// WebView/iframe 首帧常为 0×0，此时 aspect 为 NaN，
// 若只在加载时算一次 d0，镜头距离将永远是 NaN → 整个场景空白。
let lastW = 0, lastH = 0;
function updateFraming() {
  const w = window.innerWidth, h = window.innerHeight;
  if (!w || !h || (w === lastW && h === lastH)) return;
  lastW = w; lastH = h;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  d0 = fitDistance(frameRadius, stageScale * 1.02);
  camera.position.set(0, 0, d0 / zoom);
}

// ---------- Flutter 控制接口 ----------
window.setSpin = function (revPerSec) { spinRevPerSec = revPerSec; };

// 缩放 = 镜头沿视线推进（dolly），不是位图放大：
// 场景按新距离重新渲染，多近都清晰；镜头恒过原点故星球始终居中。
let zoom = 1, zoomTarget = 1;

function applySurfaceDetail() {
  const t = Math.max(0, Math.min(1, (zoomTarget - detailZoomStart) / (detailZoomFull - detailZoomStart)));
  if (cfg.normal && planetMat.normalScale) {
    const s = detailBaseNormalScale * (1 + t * 0.55);
    planetMat.normalScale.set(s, s);
  }
  if (cfg.specular) {
    planetMat.shininess = detailBaseShininess + t * 18;
  }
}

// 放大档：手机取 mapMid（6144），桌面取 mapHi（源图上限）。
// ?lod=mid|hi 显式指定（移动端 App 壳直接下发，不依赖浏览器嗅探）；
// 缺省时按指针类型判断（Web 版在手机浏览器打开也能自动降档）
const lodParam = params.get('lod');
const useMid = lodParam ? lodParam === 'mid' : isMobileLike;
const lodSrc = useMid ? cfg.mapMid : cfg.mapHi;

// LOD 迟滞切换：缩放刚开始先预热，真正放大过 lodZoomIn 才换高清档；
// 缩回 lodZoomOut 以下不立刻收尾，而是延迟降档/释放，避免手势中来回重配画布。
const lodPrewarmZoom = 1.06, lodZoomIn = 1.35, lodZoomOut = 1.15;
const lodSettleDelayMs = 700, lodDisposeDelayMs = 8000;
const initialPrewarmDelayMs = 300;
const baseTex = planetMat.map; // 常态贴图常驻，永不释放
let hiTex = null, hiLoading = false, hiPrewarmRequested = false;
let lodSettleTimer = 0, lodDisposeTimer = 0, initialPrewarmTimer = 0;

function runWhenIdle(task) {
  if ('requestIdleCallback' in window) {
    window.requestIdleCallback(task, { timeout: 1800 });
  } else {
    setTimeout(task, 350);
  }
}

function cancelLodTimers() {
  if (lodSettleTimer) {
    clearTimeout(lodSettleTimer);
    lodSettleTimer = 0;
  }
  if (lodDisposeTimer) {
    clearTimeout(lodDisposeTimer);
    lodDisposeTimer = 0;
  }
}

// createImageBitmap 只把解码挪走；首次 GPU 上传仍会卡一帧。
// 用 1x1 离屏 render target 提前采样一次，让上传发生在空闲帧。
function warmTextureOnGpu(tex) {
  if (!tex || tex.userData.gpuWarm) return;
  const warmScene = new THREE.Scene();
  const warmCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 2);
  warmCamera.position.z = 1;
  const warmGeo = new THREE.PlaneGeometry(2, 2);
  const warmMat = new THREE.MeshBasicMaterial({ map: tex });
  warmScene.add(new THREE.Mesh(warmGeo, warmMat));
  const oldTarget = renderer.getRenderTarget();
  const target = new THREE.WebGLRenderTarget(1, 1, {
    depthBuffer: false,
    stencilBuffer: false,
  });
  renderer.setRenderTarget(target);
  renderer.render(warmScene, warmCamera);
  renderer.setRenderTarget(oldTarget);
  target.dispose();
  warmGeo.dispose();
  warmMat.dispose();
  tex.userData.gpuWarm = true;
}

function prewarmPixelRatioBoost() {
  if (prZoomed === prIdle) return;
  runWhenIdle(function () {
    const before = prCurrent;
    setPixelRatioBoost(true);
    renderer.render(scene, camera);
    if (zoomTarget < lodZoomIn && before !== prZoomed) setPixelRatioBoost(false);
  });
}

function prewarmHiTexture() {
  if (hiPrewarmRequested || hiTex || !lodSrc || lodSrc === cfg.map) return;
  hiPrewarmRequested = true;
  runWhenIdle(function () { ensureHiTexture(); });
}

function scheduleInitialScenePrewarm() {
  if (!autoPrewarmEnabled || initialPrewarmTimer || hiTex || hiLoading) return;
  initialPrewarmTimer = setTimeout(function () {
    initialPrewarmTimer = 0;
    if (!autoPrewarmEnabled) return;
    prewarmHiTexture();
    prewarmPixelRatioBoost();
  }, initialPrewarmDelayMs);
}

// 解码放到主线程之外（createImageBitmap），避免大图解码时整页卡住
async function ensureHiTexture() {
  if (hiTex || hiLoading || !lodSrc || lodSrc === cfg.map) return;
  hiLoading = true;
  try {
    // 常态贴图走 TextureLoader，WebGL 上传时会翻转 Y；ImageBitmap 路径会忽略
    // Texture.flipY，所以必须在解码阶段翻转，避免 LOD 换档时地表朝向跳变。
    const bitmap = await createImageBitmap(await (await fetch(lodSrc)).blob(), {
      imageOrientation: 'flipY',
    });
    const tex = new THREE.Texture(bitmap);
    tex.flipY = false;
    tex.encoding = THREE.sRGBEncoding;
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    tex.generateMipmaps = false; // 大图 mipmap 再多吃 33% 显存
    tex.minFilter = THREE.LinearFilter;
    tex.needsUpdate = true;
    hiTex = tex;
    warmTextureOnGpu(tex);
    applyLod(); // 加载完成时可能已缩回，交由 applyLod 决定用不用
  } catch (e) {
    // 失败静默留用常态贴图，不影响交互
  } finally {
    hiLoading = false;
  }
}

// 放大时渲染像素比拉满设备（极致清晰），缩回降回常态档省电
function setPixelRatioBoost(on) {
  const target = on ? prZoomed : prIdle;
  if (target === prCurrent) return;
  prCurrent = target;
  renderer.setPixelRatio(target);
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function applyLod() {
  applySurfaceDetail();
  if (zoomTarget >= lodPrewarmZoom) {
    prewarmHiTexture();
    prewarmPixelRatioBoost();
  }
  if (zoomTarget >= lodZoomIn) {
    cancelLodTimers();
    setPixelRatioBoost(true);
    if (hiTex) {
      if (planetMat.map !== hiTex) {
        planetMat.map = hiTex;
        planetMat.needsUpdate = true;
      }
    } else {
      ensureHiTexture();
    }
  } else if (zoomTarget <= lodZoomOut) {
    scheduleLodSettleDown();
  }
}

function scheduleLodSettleDown() {
  if (lodSettleTimer) clearTimeout(lodSettleTimer);
  lodSettleTimer = setTimeout(function () {
    lodSettleTimer = 0;
    if (zoomTarget > lodZoomOut) return;
    setPixelRatioBoost(false);
    if (planetMat.map !== baseTex) {
      planetMat.map = baseTex;
      planetMat.needsUpdate = true;
    }
    scheduleHiTextureDispose();
  }, lodSettleDelayMs);
}

function scheduleHiTextureDispose() {
  if (lodDisposeTimer) clearTimeout(lodDisposeTimer);
  lodDisposeTimer = setTimeout(function () {
    lodDisposeTimer = 0;
    if (zoomTarget > lodZoomOut || !hiTex || planetMat.map === hiTex) return;
    hiTex.dispose(); // 延迟释放；短时间再次放大直接复用，避免重新 fetch/upload
    hiTex = null;
    hiPrewarmRequested = false;
  }, lodDisposeDelayMs);
}

window.setZoom = function (z) {
  zoomTarget = Math.max(1, z);
  applyLod();
};

window.setAutoPrewarm = function (on) {
  autoPrewarmEnabled = !!on;
  if (autoPrewarmEnabled) scheduleInitialScenePrewarm();
};

// 拖动转星球（地球仪手感）：Flutter 下发累计的偏航/俯仰角（弧度，绝对值）。
// 支点承载用户转动，星球/云层各自的自转照常叠加在其之上。
let yawTarget = 0, pitchTarget = 0;
const maxPitch = Math.PI / 2 * 0.92; // 别转到极点翻面
window.setRotation = function (yaw, pitch) {
  yawTarget = yaw;
  pitchTarget = Math.max(-maxPitch, Math.min(maxPitch, pitch));
};

let paused = false, disposed = false, rafId = 0;
function requestNextFrame() {
  if (!paused && !disposed && !rafId) rafId = requestAnimationFrame(animate);
}
window.pauseRender = function () {
  paused = true;
  if (rafId) {
    cancelAnimationFrame(rafId);
    rafId = 0;
  }
};
window.resumeRender = function () {
  if (disposed) return;
  paused = false;
  requestNextFrame();
};

// Web 端（iframe 跨文档）经 postMessage 调同一组接口
window.addEventListener('message', function (e) {
  const m = e.data;
  if (!m || typeof m !== 'object') return;
  if (typeof m.zoom === 'number') window.setZoom(m.zoom);
  if (typeof m.spin === 'number') window.setSpin(m.spin);
  if (typeof m.autoPrewarm === 'number') window.setAutoPrewarm(m.autoPrewarm > 0);
  if (typeof m.yaw === 'number' && typeof m.pitch === 'number') {
    window.setRotation(m.yaw, m.pitch);
  }
  // 宿主请求式快照（进大纲前拍一张，供返回时替身用）
  if (typeof m.snapshot === 'number') sendSnapshot();
  // 非当前星球页暂停渲染：滑过的页被 keepAlive 后 iframe 仍在后台
  // rAF 渲染，多球常驻会越用越卡（用户实测"一段时间后变卡"）
  if (typeof m.render === 'number') {
    if (m.render > 0) { window.resumeRender(); } else { window.pauseRender(); }
  }
  if (typeof m.dispose === 'number') disposeScene();
});

function sendSnapshot() {
  if (window.parent === window) return;
  try {
    const source = renderer.domElement;
    if (!source.width || !source.height) return;
    const maxSide = 480;
    const scale = Math.min(1, maxSide / Math.max(source.width, source.height));
    const w = Math.max(1, Math.round(source.width * scale));
    const h = Math.max(1, Math.round(source.height * scale));
    const canvas = document.createElement('canvas');
    canvas.width = w;
    canvas.height = h;
    canvas.getContext('2d').drawImage(source, 0, 0, w, h);
    window.parent.postMessage(
      'sceneSnapshot:' + (params.get('token') || '') + ':' +
        canvas.toDataURL('image/png'),
      '*'
    );
  } catch (e) {
    // WebGL 画布若被浏览器保护为不可读，快照兜底静默放弃，不影响真实场景渲染。
  }
}

// ---------- 渲染循环 ----------
let last = performance.now(), frames = 0, lastPost = last, notified = false;
function animate() {
  rafId = 0;
  if (paused || disposed) return;
  requestNextFrame();
  // 视口尺寸就绪/变化即重算取景（首帧 0×0 的 WebView 也能自愈）
  updateFraming();
  const now = performance.now();
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;
  const w = spinRevPerSec * Math.PI * 2 * dt;
  planet.rotation.y += w;
  if (clouds) clouds.rotation.y += w * 1.18 + 0.00006; // 云层略快于地表
  // 用户拖动的转角平滑趋近（跟手但不生硬）
  const kRot = Math.min(1, dt * 14);
  pivot.rotation.y += (yawTarget - pivot.rotation.y) * kRot;
  pivot.rotation.x += (pitchTarget - pivot.rotation.x) * kRot;
  // 镜头距离平滑趋近目标倍率（指数阻尼，跟手且不抖）
  if (Math.abs(zoomTarget - zoom) > 0.0005) {
    zoom += (zoomTarget - zoom) * Math.min(1, dt * 12);
    camera.position.z = d0 / zoom;
  }
  renderer.render(scene, camera);
  frames++;
  // 首帧真实渲染后立刻通知宿主"场景就绪"：宿主用它把加载期的
  // 星球替身淡出（返回首页时 iframe 重建约 1 秒，替身盖住空白期）
  if (!notified && lastW > 0) {
    if (!baseTextureReady) return;
    notified = true;
    renderer.domElement.style.opacity = '1';
    if (window.SceneBridge) {
      SceneBridge.postMessage(JSON.stringify({ ready: true }));
    }
    if (window.parent !== window) {
      // 带回宿主下发的 token：同页多颗星球时各自只认自己的就绪信号
      window.parent.postMessage('sceneReady:' + (params.get('token') || ''), '*');
      // 就绪拍一张兜底快照。不做周期快照：toDataURL 的 PNG 编码在
      // 主线程（约 20-50ms），每 5 秒一次固定 jank（用户实测"会变卡"）；
      // 之后由宿主在进大纲前请求最新一张（message.snapshot）
      sendSnapshot();
    }
  }
  if (now - lastPost > 1000) {
    if (window.SceneBridge) {
      SceneBridge.postMessage(JSON.stringify({
        fps: Math.round(frames * 1000 / (now - lastPost)),
      }));
    }
    frames = 0; lastPost = now;
  }
}
updateFraming();
requestNextFrame();
setTimeout(scheduleInitialScenePrewarm, 0);

window.addEventListener('resize', updateFraming);

function disposeScene() {
  if (disposed) return;
  disposed = true;
  window.pauseRender();
  cancelLodTimers();
  if (initialPrewarmTimer) {
    clearTimeout(initialPrewarmTimer);
    initialPrewarmTimer = 0;
  }
  window.removeEventListener('resize', updateFraming);
  if (hiTex) hiTex.dispose();
  if (baseTex) baseTex.dispose();
  if (clouds?.material?.map) clouds.material.map.dispose();
  planet.geometry.dispose();
  planet.material.dispose();
  if (clouds) {
    clouds.geometry.dispose();
    clouds.material.dispose();
  }
  atmosphere.geometry.dispose();
  atmosphere.material.dispose();
  renderer.dispose();
  renderer.domElement.remove();
}
window.addEventListener('pagehide', disposeScene);
window.addEventListener('beforeunload', disposeScene);

// ---------- 自检（?selftest=1）：serve_web.ps1 每次构建后用无头浏览器跑 ----------
// 真实调用一遍核心链路（缩放/postMessage 旋转/LOD 换档），结果写进 <title>，
// 防止"改完代码后缩放/旋转悄悄失效"这类回归溜到手机上才被发现
if (params.get('selftest') === '1') {
  setTimeout(async function () {
    const fails = [];
    try {
      const z0 = camera.position.z;
      window.setZoom(2);
      await new Promise(function (r) { setTimeout(r, 700); });
      if (!(camera.position.z < z0 * 0.75)) fails.push('zoom');
      if (!(hiTex || hiLoading)) fails.push('lod');
      window.postMessage({ yaw: 0.8, pitch: 0.2 }, '*');
      await new Promise(function (r) { setTimeout(r, 700); });
      if (Math.abs(pivot.rotation.y - 0.8) > 0.2) fails.push('rotate');
    } catch (e) {
      fails.push('error:' + e.message);
    }
    document.title = fails.length ? 'SELFTEST_FAIL:' + fails.join('+') : 'SELFTEST_PASS';
  }, 1200);
}
</script>
</body>
</html>
