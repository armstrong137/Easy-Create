name: planet_3d_demo
description: "P1 技术验证：Flutter 壳 + WebView(three.js) 真实 3D 地球 Demo"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  # WebView 承载离线打包的 three.js 3D 场景
  webview_flutter: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/web/
    - assets/web/textures/
